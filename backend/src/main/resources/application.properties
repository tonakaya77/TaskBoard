spring.application.name=TaskBoard

# データベースの接続先（compose.yaml の PostgreSQL）
# ./gradlew bootRun のときは、Spring Boot が compose.yaml の PostgreSQL を自動で起動する。
# 値は環境変数で上書きできる（例: 公開先のデータベースにつなぐとき）。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

# アプリを止めても PostgreSQL は止めない（次の起動が速くなり、データも消えない）
spring.docker.compose.lifecycle-management=start-only

# MyBatis: snake_case の列名を camelCase のフィールドに対応させる
mybatis.configuration.map-underscore-to-camel-case=true
